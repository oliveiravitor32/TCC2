services:
  db:
    image: postgres:16
    container_name: tcc_postgres
    environment:
      POSTGRES_DB: iluminacao
      POSTGRES_USER: iluminacao
      POSTGRES_PASSWORD: iluminacao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Rodam uma unica vez, na criacao do volume, em ordem alfabetica.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/seed_cadastro.sql:/docker-entrypoint-initdb.d/03-seed_cadastro.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iluminacao -d iluminacao"]
      interval: 5s
      retries: 10

  broker:
    image: eclipse-mosquitto:2
    container_name: tcc_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  pgdata:
