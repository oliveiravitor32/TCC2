# Base de regras Mamdani - versao v2-sem-meteorologia (TCC 3.7, RNF05)
#
# Qualquer alteracao neste arquivo exige NOVA VERSAO (novo arquivo e nova
# linha em versao_base_regras): o hash do conteudo e gravado no banco e a
# decisao registra a versao que a produziu (RNF04).
#
# Diferenca para a v1-tercis: a condicao meteorologica deixou de ser entrada
# (DIVERGENCIAS 49). A plataforma de monitoramento nao produz dado
# meteorologico, e o trabalho nao integra uma terceira fonte. Sairam a regra
# de chuva e a condicao "meteorologia = normal" das regras de atenuacao; as
# regras foram renumeradas (v1 -> v2: R1->R1, R3->R2, R4->R3, R5->R4,
# R6->R5, R7->R6, R8->R7, R9->R8).
#
# Fronteiras nos TERCIS da distribuicao observada (3.7), calculados por
# modelo/treinar.py sobre a serie de Melbourne extraida em 2026-09-23
# (49 pontos), normalizada por ponto de medicao pelo percentil 99. Nao sao
# arbitrados pelos autores: qualquer leitor que aplique o mesmo procedimento
# a mesma serie chega aos mesmos valores.

rotulo = "v2-sem-meteorologia"
resumo = "Tercis da serie de Melbourne (2026-09-23), normalizada por ponto; 8 regras; sem condicao meteorologica; atenuacao condicionada a ausencia de ocorrencia."

# ---------------------------------------------------------------------------
# Movimentacao observada e prevista: baixa / media / alta, trapezoidais.
# O patamar de pertinencia plena cobre o interior de cada tercil; as rampas
# cobrem `meia_largura_rampa` para cada lado da fronteira (3.7).
# ---------------------------------------------------------------------------
[movimentacao]
fronteiras = [0.1038, 0.4053]
meia_largura_rampa = 0.05

# ---------------------------------------------------------------------------
# Faixa horaria (apoio, Quadro 7): horas decorridas desde as 18h, 0 a 12.
# Horarios fora de 18h-06h sao levados ao extremo mais proximo.
# ---------------------------------------------------------------------------
[faixa_horaria.conjuntos]
inicio_noite  = [0.0, 0.0, 3.0, 5.0]    # 18h-21h pleno, sai ate 23h
madrugada     = [4.0, 6.0, 9.0, 10.0]   # 00h-03h pleno
pre_amanhecer = [9.0, 10.0, 12.0, 12.0] # 04h-06h pleno

# ---------------------------------------------------------------------------
# Saida: nivel pretendido, fracao do fluxo pleno, universo 0 a 1.
# A inferencia NAO conhece o piso normativo: quem o impoe e a camada de
# verificacao (separacao adaptativa x fixa, 3.7).
# ---------------------------------------------------------------------------
[saida.conjuntos]
reduzido      = [0.0, 0.0, 0.2, 0.45]
intermediario = [0.3, 0.5, 0.6, 0.8]
pleno         = [0.8, 0.95, 1.0, 1.0]

# ---------------------------------------------------------------------------
# Regras. Antecedentes ligados por E (minimo).
#
# As regras que ATENUAM abaixo do pleno (R5 a R8) exigem ocorrencia = nao: na
# agregacao por maximo com centroide, uma regra de reducao ativa ao lado de
# uma de elevacao puxaria a saida para baixo, e a evidencia de risco seria
# diluida. Condicionar a reducao a ausencia de risco e restricao deliberada
# de interpretabilidade (PICKERING et al., 2026).
#
# Variaveis:
#   ocorrencia     = sim | nao
#   observada      = baixa | media | alta
#   prevista       = baixa | media | alta
#   faixa_horaria  = inicio_noite | madrugada | pre_amanhecer
# ---------------------------------------------------------------------------
[[regra]]
id = "R1"
se = { ocorrencia = "sim" }
entao = "pleno"
origem = "Dominio: ocorrencia reportada justifica elevacao independentemente da movimentacao (Quadro 7, 1.6)"

[[regra]]
id = "R2"
se = { observada = "alta" }
entao = "pleno"
origem = "Norma: NBR 5101, 6.10.3 - monitoramento do trafego determina o funcionamento"

[[regra]]
id = "R3"
se = { prevista = "alta" }
entao = "pleno"
origem = "Literatura: antecipacao da demanda (2.7; BELLONI et al., 2024)"

[[regra]]
id = "R4"
se = { observada = "media" }
entao = "intermediario"
origem = "Norma: NBR 5101, 6.10.3"

[[regra]]
id = "R5"
se = { ocorrencia = "nao", observada = "baixa", prevista = "baixa" }
entao = "reduzido"
origem = "Norma: NBR 5101, 6.3 e 6.10.3 - reduzir nos horarios de baixa movimentacao"

[[regra]]
id = "R6"
se = { ocorrencia = "nao", observada = "baixa", prevista = "media" }
entao = "intermediario"
origem = "Literatura: antecipacao da demanda (2.7; BELLONI et al., 2024)"

[[regra]]
id = "R7"
se = { ocorrencia = "nao", faixa_horaria = "madrugada", observada = "baixa", prevista = "baixa" }
entao = "reduzido"
origem = "Norma: NBR 5101, 6.3 - baixa movimentacao"

[[regra]]
id = "R8"
se = { ocorrencia = "nao", faixa_horaria = "inicio_noite", observada = "baixa" }
entao = "intermediario"
origem = "Dominio: faixa horaria como evidencia de apoio (Quadro 7)"
