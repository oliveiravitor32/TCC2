# Broker de producao (TCC 4.6.1, RNF06). Mosquitto 2.
#
# Duas portas:
#   1883 - so na rede interna do docker (nao publicada): servico de decisao.
#   8883 - publicada na internet, com TLS: nos de iluminacao.
# Nas duas, usuario e senha obrigatorios e permissao por topico (acl).
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
protocol mqtt

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/servidor.crt
keyfile /mosquitto/certs/servidor.key
tls_version tlsv1.2
