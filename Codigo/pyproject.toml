[project]
name = "iluminacao-adaptativa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "scipy>=1.11",
    "networkx>=3",
    "scikit-fuzzy==0.5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "paho-mqtt>=2.1",
    "tzdata",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
